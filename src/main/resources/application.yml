server:
  port: 8080

spring:
  application:
    name: paygate-guard

  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:paygatedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  # Enable H2 Web Console at http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  # Hibernate / JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger / OpenAPI UI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
